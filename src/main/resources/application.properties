# ============================================================
# FORMAGEST - SPRING BOOT CONFIGURATION
# ============================================================

# ------------------------------------------------------------
# 1. GENERAL CONFIGURATION
# ------------------------------------------------------------

# Application name used by Spring Boot.
spring.application.name=FormaGest


# ------------------------------------------------------------
# 2. WEB SERVER CONFIGURATION
# ------------------------------------------------------------

# HTTP port used by the embedded Tomcat server.
# Port 8081 avoids conflicts with Jenkins running on port 8080.
server.port=8081


# ------------------------------------------------------------
# 3. DATABASE CONFIGURATION - POSTGRESQL
# ------------------------------------------------------------

# Local PostgreSQL database connection.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/formagest_db}

# PostgreSQL username.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}

# PostgreSQL password stored in an environment variable.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

