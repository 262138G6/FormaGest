# ============================================================
# FORMAGEST - SPRING BOOT CONFIGURATION
# ============================================================

# ------------------------------------------------------------
# 1. GENERAL CONFIGURATION
# ------------------------------------------------------------

# Application name used by Spring Boot.
spring.application.name=FormaGest


# ------------------------------------------------------------
# 2. WEB SERVER CONFIGURATION
# ------------------------------------------------------------

# HTTP port used by the embedded Tomcat server.
# Port 8081 avoids conflicts with Jenkins running on port 8080.
server.port=8081


# ------------------------------------------------------------
# 3. DATABASE - TEMPORARY CONFIGURATION
# ------------------------------------------------------------

# TEMPORARY: Disables automatic JDBC DataSource configuration.
# Used during initial setup before PostgreSQL is configured.
#
# IMPORTANT:
# Remove this property during task FG-005 when the PostgreSQL
# connection is configured.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
