
# ============================================================
# FORMAGEST - SPRING BOOT CONFIGURATION
# ============================================================

# ------------------------------------------------------------
# 1. GENERAL CONFIGURATION
# ------------------------------------------------------------

# Application name used by Spring Boot.
spring.application.name=FormaGest


# ------------------------------------------------------------
# 2. WEB SERVER CONFIGURATION
# ------------------------------------------------------------

# HTTP port used by the embedded Tomcat server.
# Port 8081 avoids conflicts with Jenkins running on port 8080.
server.port=8081


# ------------------------------------------------------------
# 3. DATABASE CONFIGURATION - POSTGRESQL
# ------------------------------------------------------------

# Local PostgreSQL database connection.
spring.datasource.url=jdbc:postgresql://localhost:5432/formagest_db

# PostgreSQL username.
spring.datasource.username=postgres

# PostgreSQL password loaded from an environment variable.
# Never store database credentials in source control.
spring.datasource.password=${POSTGRES_PASSWORD}


# ------------------------------------------------------------
# 4. JPA / HIBERNATE CONFIGURATION
# ------------------------------------------------------------

# Prevent Hibernate from automatically modifying database tables.
# The database schema is managed separately through SQL scripts.
#spring.jpa.hibernate.ddl-auto=none

spring.jpa.hibernate.ddl-auto=validate


# Disable SQL statement logging in the console.
spring.jpa.show-sql=false
